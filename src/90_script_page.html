
<script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Coloration syntaxique ---------- */
  function highlight(el) {
    try { if (window.Prism && Prism.highlightElement) Prism.highlightElement(el); } catch (e) {}
  }
  try { if (window.Prism && Prism.highlightAll) Prism.highlightAll(); } catch (e) {}

  /* ---------- Boutons « Copier » ---------- */
  function selectText(el) {
    try {
      var r = document.createRange(); r.selectNodeContents(el);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
  }
  document.querySelectorAll("figure.code").forEach(function (fig) {
    var cap = fig.querySelector("figcaption");
    var code = fig.querySelector("pre code");
    if (!cap || !code || fig.classList.contains("compact")) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "copy-btn"; b.textContent = "Copier";
    b.addEventListener("click", function () {
      var done = function () { b.textContent = "Copié"; setTimeout(function () { b.textContent = "Copier"; }, 1500); };
      var fail = function () { selectText(code); b.textContent = "Texte sélectionné"; setTimeout(function () { b.textContent = "Copier"; }, 1800); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code.textContent).then(done, fail);
        } else { fail(); }
      } catch (e) { fail(); }
    });
    cap.appendChild(b);
  });

  /* ---------- Quiz ---------- */
  document.querySelectorAll(".quiz").forEach(function (q) {
    var answer = q.getAttribute("data-answer");
    var why = q.querySelector(".quiz-why");
    var verdict = why ? why.querySelector(".verdict") : null;
    var buttons = q.querySelectorAll(".quiz-opts button");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        buttons.forEach(function (b) { b.classList.remove("is-right", "is-wrong"); b.removeAttribute("aria-pressed"); });
        var right = btn.getAttribute("data-k") === answer;
        btn.setAttribute("aria-pressed", "true");
        if (right) { btn.classList.add("is-right"); }
        else {
          btn.classList.add("is-wrong");
          var good = q.querySelector('.quiz-opts button[data-k="' + answer + '"]');
          if (good) good.classList.add("is-right");
        }
        if (verdict) { verdict.textContent = right ? "Bonne réponse." : "Pas tout à fait."; verdict.className = "verdict " + (right ? "ok" : "ko"); }
        if (why) why.hidden = false;
      });
    });
  });

  /* ---------- Progression (navigateur local uniquement) ---------- */
  var KEY = "react-backend-course-read-v1";
  var read = {};
  try { read = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { read = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {} }
  var modules = Array.prototype.slice.call(document.querySelectorAll("section.module"));
  var totalEl = document.getElementById("progress-total");
  if (totalEl) totalEl.textContent = modules.length;
  function renderProgress() {
    var n = 0;
    modules.forEach(function (m) {
      var id = m.id, isRead = !!read[id];
      if (isRead) n++;
      var link = document.querySelector('.toc-list a[data-id="' + id + '"]');
      if (link) link.classList.toggle("is-read", isRead);
      var btn = m.querySelector(".mark-read");
      if (btn) {
        btn.setAttribute("aria-pressed", isRead ? "true" : "false");
        btn.textContent = isRead ? "Module lu ✓" : "Marquer ce module comme lu";
      }
    });
    var c = document.getElementById("progress-count"); if (c) c.textContent = n;
    var f = document.getElementById("progress-fill"); if (f) f.style.width = (modules.length ? (n / modules.length) * 100 : 0) + "%";
  }
  document.querySelectorAll(".mark-read").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var id = btn.getAttribute("data-id");
      if (read[id]) delete read[id]; else read[id] = true;
      save(); renderProgress();
    });
  });
  renderProgress();

  /* ---------- Sommaire : module courant + repli sur mobile ---------- */
  var toc = document.getElementById("toc");
  try { if (toc && window.matchMedia("(max-width: 980px)").matches) toc.open = false; } catch (e) {}
  if (toc) toc.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a");
    try { if (a && window.matchMedia("(max-width: 980px)").matches) toc.open = false; } catch (err) {}
  });
  if ("IntersectionObserver" in window) {
    var links = {};
    document.querySelectorAll(".toc-list a").forEach(function (a) { links[a.getAttribute("data-id")] = a; });
    var current = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          if (current && links[current]) links[current].classList.remove("is-current");
          current = en.target.id;
          if (links[current]) links[current].classList.add("is-current");
        }
      });
    }, { rootMargin: "-35% 0px -60% 0px" });
    modules.forEach(function (m) { io.observe(m); });
  }

  /* ---------- Utilitaire de journal ---------- */
  function logger(box) {
    return {
      clear: function () { box.innerHTML = ""; },
      add: function (cls, text) {
        var empty = box.querySelector(".l-empty"); if (empty) empty.remove();
        var p = document.createElement("p"); p.className = cls; p.textContent = text;
        box.appendChild(p); box.scrollTop = box.scrollHeight;
      }
    };
  }

  /* ---------- Démo 1 : let contre useState ---------- */
  (function () {
    var root = document.getElementById("demo-state"); if (!root) return;
    var out = function (k) { return root.querySelector('[data-out="' + k + '"]'); };
    var log = logger(out("log"));
    var letVar = 0, letShown = 0, stateVal = 0, renders = 1;
    function paint() {
      out("let-display").textContent = letShown;
      out("let-value").textContent = letVar;
      out("state-display").textContent = stateVal;
      out("state-renders").textContent = renders;
    }
    root.addEventListener("click", function (e) {
      var t = e.target.closest("[data-act]"); if (!t) return;
      var act = t.getAttribute("data-act");
      if (act === "let-click") {
        letVar++;
        log.add("l-let", "[let] clic : count = " + letVar + " dans la variable. React n'est pas prévenu, l'écran affiche toujours " + letShown + ".");
      } else if (act === "let-rerender") {
        letVar = 0; letShown = 0;
        log.add("l-let", "[let] re-rendu : Counter() est rappelée, « let count = 0 » s'exécute à nouveau. La variable repart de 0.");
      } else if (act === "state-click") {
        stateVal++; renders++;
        log.add("l-state", "[useState] setCount(" + stateVal + ") → React planifie un rendu → Counter() rappelée, useState renvoie " + stateVal + " → l'écran affiche " + stateVal + ".");
      } else if (act === "reset") {
        letVar = 0; letShown = 0; stateVal = 0; renders = 1; log.clear();
        log.add("l-empty", "Le journal des événements s'affiche ici.");
      }
      paint();
    });
    paint();
  })();

})();
</script>
